<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Attendance</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .card {
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary px-4 shadow-sm">
        <span class="navbar-brand mb-0 h1 fw-bold">🎓 College Attendance System</span>
        <a href="/" class="btn btn-outline-light btn-sm px-3">Logout</a>
    </nav>

    <!-- Main Container -->
    <div class="container mt-5 mb-5">
        <div class="card shadow-lg p-4 border-0 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="text-dark fw-bold">Mark Student Attendance</h3>
                <a href="/teacher_dashboard" class="btn btn-outline-secondary btn-sm">Back to Dashboard</a>
            </div>
            <p class="text-muted">Select Present or Absent for each student below:</p>
            <hr class="mb-4">

            <form method="POST">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th class="py-3">Roll No / Username</th>
                                <th class="py-3">Student Name</th>
                                <th class="py-3">Attendance Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for student in students %}
                            <tr>
                                <td class="fw-semibold text-secondary">{{ student[1] }}</td>
                                <td class="fw-bold text-dark">{{ student[1] | capitalize }}</td>
                                <td>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="status_{{ student[0] }}" value="Present" checked>
                                        <label class="form-check-label text-success fw-bold">Present</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="status_{{ student[0] }}" value="Absent">
                                        <label class="form-check-label text-danger fw-bold">Absent</label>
                                    </div>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                <button type="submit" class="btn btn-success btn-lg mt-3 px-4 shadow-sm">Submit Attendance</button>
            </form>
        </div>
    </div>

</body>
</html>
